<div class="ui-g ui-fluid">
    <div class="ui-g-1">
        <!-- <app-tutorial [Classificacao]="'3.07.03'"></app-tutorial> -->
    </div>
    <div class="ui-g-1 ui-g-offset-6" style="font-size: 18px; margin-right: -50px;">
        <i class="fa fa-file-pdf" style="cursor: pointer;" (click)="downloadPdf()"></i>
    </div>
    <div class="ui-g-2">
        <button pButton label="Reprocessar Extrato" (click)="reprocessarExtrato()"></button>
    </div>
    <div class="ui-g-2">
        <button pButton label="Processar Conciliação" (click)="processarConciliacao()"></button>
    </div>
</div>
<div class="ui-g ui-fluid">
    <p-table [paginator]="true" [rows]="10" [totalRecords]="extratoContaBanco.length" [value]="extratoContaBanco"
        [rowsPerPageOptions]="opcoesLinhas">
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 15%;">Data do Extrato</th>
                <th style="width: 50%;">Histórico</th>
                <th style="width: 10%;">Valor</th>
                <th style="width: 10%;">Conciliado</th>
                <th style="width: 5%;"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
                <td appAlignCenter>{{rowData.DataMovimento | date}}</td>
                <td>{{rowData.Historico}}</td>
                <td appAlinharDireita [ngClass]="colorValue(rowData.Valor)">{{rowData.Valor | virgulaPipe}}</td>
                <td>{{rowData.Conciliado === 'N' ? 'Não' : 'Sim'}}</td>
                <td>
                    <app-opcoes-table [value]="rowData" [opcoes]="itemsRow"></app-opcoes-table>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
<p-confirmDialog header="Confirmacao" icon="pi pi-exclamation-triangle" width="425"></p-confirmDialog>
