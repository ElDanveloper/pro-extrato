<div class="p-fluid">
    <div class="p-fluid p-formgrid p-grid">
        <div class="p-col-4 p-grid p-offset-3">
            <div class="p-col-4" style="margin-top: 10px;">
                <button pButton type="button" label="Atualizar" icon="pi pi-check" class="p-button-lg"></button>
                <!-- <p-card header="Atualizar" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                </p-card> -->
            </div>
            <div class="p-col-4" style="margin-top: 10px;">
                <app-date [(ngModel)]="dateStart"></app-date>
            </div>
            <div class="p-col-4" style="margin-top: 10px;">
                <app-date [(ngModel)]="dateEnd"></app-date>
            </div>
        </div>
        <div class="p-col-4" style="margin-top: 10px; margin-right: -155px;">
            <app-date-navigator (alterouData)="alterouData($event)"></app-date-navigator>
        </div>
    </div>
    &nbsp;

    <div class="p-col-12 p-grid p-fluid">

        <div class="p-col-3">
            <div class="p-col-3">
                <p-card *ngIf="this.data" header="Saldo total" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                    <span [ngClass]="colorValue(Balance)">R$ {{ Balance | virgulaPipe }}</span>
                </p-card>
            </div>
        </div>

        <div class="p-col-9 p-grid p-fluid" style="width:85%; display: flex; justify-content: flex-end; margin-top: -130px;">

            <div class="p-col-9 p-grid p-fluid" >
                <div class="p-col-3" style="margin-left: 120px;">
                    <p-card header="" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                        <div>
                            <p>Receitas</p>
                            <p-progressBar [value]="Revenues" [style]="{'height': '15px'}"></p-progressBar>
                        </div>
                        <div>
                            <p>Despesas</p>
                            <p-progressBar [value]="Expenses" [style]="{'height': '15px'}"></p-progressBar>
                        </div>
                        <div *ngIf="this.data">
                            <span>Margem {{ Margin }} </span>
                        </div>
                    </p-card>
                </div>

                <div class="p-col-3">
                    <p-card header="Conciliações" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                       <span>Conciliações Pendêntes: {{pendentes}}</span>
                    </p-card>
                </div>
            </div>

            <div class="p-col-4 container">
                <div class="card">
                    <h5 class="centerText">Relatório de Receitas</h5>
                    <p-chart type="doughnut" [data]="dataDoughnut" [options]="optionsDoughnut" [style]="{'width': '40%'}"></p-chart>
                </div>
            </div>

            <div class="p-col-4 container">
                <div class="card">
                    <h5 class="centerText">Principais Despesas</h5>
                    <p-chart type="pie" [data]="dataDoughnut2" [options]="chartOptions"></p-chart>
                </div>
            </div>

            <div class="p-col-8">
                <div class="card">
                    <!-- <p-card header="Lançamentos" [style]="{'width': '30rem', 'margin-bottom': '2em'}"> -->
                    <h5 class="centerText">Lançamento</h5>
                    <p-chart type="bar" [data]="dataBar" [options]="optionsBar"></p-chart>
                    <!-- </p-card> -->
                </div>
            </div>
        </div>
    </div>
    <div class="card">
        <h5 class="centerText">Relatório de Receitas</h5>
        <p-chart type="doughnut" [data]="dataDoughnut" [options]="optionsDoughnut" [style]="{'width': '40%'}"></p-chart>
    </div>
</div>
