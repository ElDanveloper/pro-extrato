<div class="p-fluid">
    <div class="p-col-12 p-grid p-fluid">

        <div class="p-col-3">
            <div class="p-col-4">
                <p-card header="Pendecias com analistas" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                    <ng-template pTemplate="header">
                    </ng-template>
                    <p>620 Lançamentos</p>
                    <p>52 Empresas</p>
                </p-card>
            </div>
            <div class="p-col-4">
                <p-card header="Pendecias com clientes" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                    <ng-template pTemplate="header">
                    </ng-template>
                    <p>180 Lançamentos</p>
                    <p>32 Empresas</p>
                </p-card>
            </div>
            <!-- <div class="p-offset-2 p-grid p-fluid"></div> -->
        </div>

        <div class="p-col-4">
            <div class="card">
                <!-- <p-card header="Lançamentos" [style]="{'width': '30rem', 'margin-bottom': '2em'}"> -->
                <h5 class="centerText">Lançamento</h5>
                <p-chart type="bar" [data]="data" [options]="chartOptions"></p-chart>
                <!-- </p-card> -->
            </div>
        </div>

        <div class="p-col-4">
            <!-- <p-card header="Analista" [style]="{'width': '30rem', 'margin-bottom': '2em'}"> -->
            <div class="card">
                <h5 class="centerText">Analista</h5>
                <!-- <ng-template pTemplate="header">
            </ng-template> -->
                <p-chart type="doughnut" [data]="data" [options]="chartOptions" [style]="{'width': '40%'}"></p-chart>
            </div>
            <!-- </p-card> -->
        </div>

    </div>
    <div class="p-col-12 p-grid p-fluid">
        <div class="p-col-4">
            <p-card header="Processos com nomes" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                <ng-template pTemplate="header">
                </ng-template>
                <div>
                    <p>Inteligência Artificial</p>
                    <div class="proccess-bar"></div>
                </div>
                <div>
                    <p>Analistas</p>
                    <div class="proccess-bar"></div>
                </div>
                <div>
                    <p>Clientes</p>
                    <div class="proccess-bar"></div>
                </div>
            </p-card>
        </div>
        <div class="p-col-3">
            <div class="card">
                <!-- <p-card header="Lançamentos" [style]="{'width': '30rem', 'margin-bottom': '2em'}"> -->
                <h5 class="centerText">Lançamento</h5>
                <p-chart type="bar" [data]="data" [options]="chartOptions"></p-chart>
                <!-- </p-card> -->
            </div>
        </div>
    </div>
</div>
