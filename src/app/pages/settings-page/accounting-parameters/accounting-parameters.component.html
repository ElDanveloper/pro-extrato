<ng-container *ngTemplateOutlet="conteudo"></ng-container>
<ng-template #conteudo>
    <div [formGroup]="form">
        <p-card>
            <div style="margin-left:15px;" class="p-fluid p-formgrid p-grid">
                <h1 style="font-size: 18px;margin-right:10px;">Parametros da Contabilidade</h1>
            </div>
            <div principal class="p-fluid">
                <div class="p-fluid p-formgrid p-grid">
                    <div class="p-field p-col-4 p-md-4">
                        <!-- DeparmentConciliateId -->
                        <app-select [label]="'Departamento Conciliação'" formControlName="DeparmentConciliateId"></app-select>
                    </div>
                    <div class="p-field p-col-4 p-md-4">
                        <!-- DeparmentAccountingId -->
                        <app-select [label]="'Departamento Contabil'"  formControlName="DeparmentAccountingId"></app-select>
                    </div>
                </div>
                <div class="p-fluid p-formgrid p-grid">
                    <div class="p-field p-col-4 p-md-4">
                        <!-- DeparmentFiscalId -->
                        <app-select [label]="'Departamento Fiscal'"  formControlName="DeparmentFiscalId"></app-select>
                    </div>
                    <div class="p-field p-col-4 p-md-4">
                        <!-- DeparmentRhId -->
                        <app-select [label]="'Departamento Pessoal - (RH)'"  formControlName="DeparmentRhId"></app-select>
                    </div>
                </div>
                <div class="p-fluid p-formgrid p-grid">
                    <div class="p-field p-col-4 p-md-4">
                        <!-- DeparmentCorpoateId -->
                        <app-select [label]="'Departamento Societário'"  formControlName="DeparmentCorpoateId"></app-select>
                    </div>
                    <div class="p-field p-col-4 p-md-4">
                        <!-- DeparmentCommercialId -->
                        <app-select [label]="'Departamento Comercial'"  formControlName="DeparmentCommercialId"></app-select>
                    </div>
                </div>
                <div class="p-fluid p-formgrid p-grid">
                    <div class="p-field p-col-4 p-md-4">
                        <!-- DeparmentAdmId -->
                        <app-select [label]="'Departamento Adm'"  formControlName="DeparmentAdmId"></app-select>
                    </div>
                    <div class="p-field p-col-4 p-md-4">
                        <!-- DeparmentBPOId -->
                        <app-select [label]="'Departamento BPO'"  formControlName="DeparmentBPOId"></app-select>
                    </div>
                </div>
            </div>

            <app-page-divided>
                <div principal class="p-fluid p-formgrid p-grid">
                    <div class="p-field p-col-4 p-md-4" style="margin-right: 40px;">
                        <app-input [label]="'Último Email'" [(ngModel)]="DateLastEmailDoc" formControlName="DateLastEmailDoc"></app-input>
                    </div>
                    <div class="p-field p-col-6 p-md-6">
                        <app-input [label]="'Última Mensagem Whatsapp'"  [(ngModel)]="DateLastZap" formControlName="DateLastZap"></app-input>
                    </div>
                </div>
            </app-page-divided>

            <div class="p-fluid p-formgrid p-grid">
                <div class="p-field p-col-8 p-md-8" style="margin-top: 10px;">
                    <app-footer-page [end]="true" [tamanhoConfirma]="'p-col-2'" [tamanhoCancelar]="'p-col-2'"
                        (confirmar)="processarFormulario()" (cancelar)="cancelarLocal()"
                        [labelConfirmar]="'Salvar'">
                    </app-footer-page>
                </div>
            </div>
        </p-card>
    </div>

</ng-template>
<p-toast position="bottom-right"></p-toast>
