<ng-container *ngTemplateOutlet="conteudo"></ng-container>
<ng-template #conteudo>
    <div >
        <p-card>
            <div class="p-fluid p-formgrid p-grid">
                <div class="p-field p-col-12 p-md-2">
                    <app-input-cpf-cnpj primeiro [label]="'Cnpj'" [row]="true" (onBlur)="buscaCnpj($event)"
                        (onKeypress)="buscaCnpj($event)" [isReadOnly]="true"></app-input-cpf-cnpj>
                </div>
                <div class="p-field p-col-12 p-md-2">
                    <app-input [label]="'Código'"></app-input>
                </div>
                <div class="p-field p-offset-6 p-col-2 p-md-2">
                    <div>
                        <span>Ativo</span>
                    </div>
                    <div>
                        <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                            >
                        </p-toggleButton>
                    </div>
                </div>
            </div>
            <div class="p-fluid p-formgrid p-grid">
                <div class="p-field p-col-12 p-md-6">
                    <app-input [label]="'Razão Social'"></app-input>
                </div>
                <div class="p-field p-col-12 p-md-6">
                    <app-input [label]="'Nome fantasia'"></app-input>
                </div>
            </div>
            <div class="p-fluid p-formgrid p-grid">
                <div class="p-field p-col-12 p-md-6">
                    <app-input [label]="'Contato'"></app-input>
                </div>
                <div class="p-field p-col-12 p-md-6">
                    <app-input [label]="'Email'"></app-input>
                </div>
            </div>
            <div class="p-fluid p-formgrid p-grid" >
                <div class="p-field p-col-12 p-md-4">
                    <app-input-telefone [label]="'Celular'"></app-input-telefone>
                </div>
                <div class="p-field p-col-12 p-md-4">
                    <app-select [label]="'Segmento'" [options]="segmento"></app-select>
                </div>
                
            </div>
            <div class="p-fluid p-formgrid p-grid">                
                <div class="p-field p-col-12 p-md-12" style="margin-top: 10px;">
                    <app-footer-page [end]="true" [tamanhoConfirma]="'p-col-2'" [tamanhoCancelar]="'p-col-2'"
                        (confirmar)="processarFormulario()" (cancelar)="cancelarLocal()" [labelConfirmar]="'Confirmar'">
                    </app-footer-page>
                </div>
            </div>
        </p-card>
    </div>

</ng-template>
<p-toast position="bottom-right"></p-toast>
