<div class="p-fluid">
    <div class="p-col-12 p-grid p-fluid">

        <div class="p-col-3">
            <div class="p-col-3">
                <p-card header="Saldo total" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                    <p>R$ 73.538,69</p>
                </p-card>
            </div>

            <div class="p-col-3">
                <p-card header="" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                    <div>
                        <p>Receitas</p>
                        <div class="proccess-bar"></div>
                    </div>
                    <div>
                        <p>Despesas</p>
                        <div class="proccess-bar"></div>
                    </div>

                    <div>
                        <p>Margem -22%</p>
                    </div>
                </p-card>
            </div>

            <div class="p-col-3">
                <p-card header="Conciliações" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
                    <button pButton label="Conciliações" type="button" badge="8">
                    </button>
                </p-card>
            </div>
        </div>

        <div class="p-col-3" style="height: 50px;">
            <button pButton type="button" label="Atualizar" icon="pi pi-check" class="p-button-lg"></button>
            <!-- <p-card header="Atualizar" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
            </p-card> -->
        </div>
        <div class="p-col-3" style="height: 50px;">
            <button pButton type="button" label="Extrato" icon="pi pi-check" class="p-button-lg"></button>
            <!-- <p-card header="Extrato" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
            </p-card> -->
        </div>
        <div class="p-col-3" style="height: 50px;">
            <button pButton type="button" label="Nova Conta" icon="pi pi-check" class="p-button-lg"></button>
            <!-- <p-card header="Nova Conta" [style]="{'width': '20rem', 'margin-bottom': '1em'}">
            </p-card> -->
        </div>
        <div class="p-col-9 p-grid p-fluid" style="width:85%; display: flex; justify-content: flex-end; margin-top: -400px;">
            <div class="p-col-4 container">
                <div class="card">
                    <h5 class="centerText">Relatório de Receitas</h5>
                    <p-chart type="pie" [data]="data" [options]="chartOptions"></p-chart>
                </div>
            </div>

            <div class="p-col-4 container">
                <div class="card">
                    <h5 class="centerText">Principais Despesas</h5>
                    <p-chart type="pie" [data]="data" [options]="chartOptions"></p-chart>
                </div>
            </div>

            <div class="p-col-8">
                <div class="card">
                    <!-- <p-card header="Lançamentos" [style]="{'width': '30rem', 'margin-bottom': '2em'}"> -->
                    <h5 class="centerText">Lançamento</h5>
                    <p-chart type="bar" [data]="data" [options]="chartOptions"></p-chart>
                    <!-- </p-card> -->
                </div>
            </div>
        </div>
    </div>
</div>
