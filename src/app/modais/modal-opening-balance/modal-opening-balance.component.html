<ng-template #conteudo>
    <app-page-divided [padrao]="false">
        <div principal>
            <div class="p-fluid p-formgrid p-grid">
                <div class="p-col-6">
                    <app-select [icon]="true" [label]="'Conta'" [options]="selectContaCaixa"></app-select>
                </div>
            <!-- </div>

            <div class="p-fluid p-formgrid p-grid"> -->
                <div class="p-col-6">
                    <app-date label="Data"></app-date>
                </div>
                <div class="p-col-6">
                    <app-input-money label="Valor"></app-input-money>
                </div>
            </div>
            <div style="margin-top: 50px;">
                <app-footer-page [end]="true" (confirmar)="processarFormulario()" (cancelar)="cancelar()"
                    labelConfirmar="Gravar"></app-footer-page>
            </div>
        </div>
    </app-page-divided>
</ng-template>
