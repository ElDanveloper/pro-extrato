<p-dialog [modal]="true" [responsive]="true" [contentStyle]="{'width':'800px', 'overflow':'visible'}"
    [maximizable]="false" [header]="'Categoria Financeira'" [(visible)]="modalVisible" (onHide)="fecharModal()">
    <p-card>
        <div *ngIf="primeiraEtapa" class="p-col p-fluid">
            <div class="p-col-12">
                <div class="p-col-12">
                    <app-select (onValueChange)="setarClassificacao($event)" label="Lista de Natureza"
                        [options]="selectListaNatureza"></app-select>
                </div>
                <div class="p-col-12">
                    <app-input [label]="'Descrição'" formControlName="Descricao"></app-input>
                </div>
                <div class="p-field p-col-2 p-md-2" style="margin-left: 6px;">
                    <div>
                        <span>Ativo</span>
                    </div>
                    <div>
                        <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                            formControlName="Sintetico">
                        </p-toggleButton>
                    </div>
                </div>
                <!-- <div style="margin-left: 10px;" class="p-col-12">
                    <label>Sintético</label>
                    <div style="margin-bottom: 5px;" *ngFor="let category of categories" class="p-field-checkbox">
                        <p-radioButton [inputId]="category.key" name="category" [value]="category"
                            [(ngModel)]="sintetico" formControlName="Sintetico"></p-radioButton>
                        <label style="margin-left: 5px;" [for]="category.key">{{category.name}}</label>
                    </div>
                </div> -->
            </div>
            <div style="display: flex;align-items: flex-end;justify-content: flex-end;" class="p-col-6 p-offset-6">
                <div class="p-col-4">
                    <button class="p-button-danger" pButton type="button" label="Cancelar"
                        (click)="fecharModal()"></button>
                </div>
                <div class="p-col-4">
                    <button pButton type="button" [label]="'Avançar'" (click)="avancarSegundaEtapa()"></button>
                </div>
            </div>
        </div>

        <!-- <div style="height: 250px;" *ngIf="segundaEtapa" class="p-col p-fluid">
            <div class="p-col-8 p-col-nopad">
                <app-select (onValueChange)="setarValue($event)" label="Natureza Financeira"
                    [options]="selectNaturezaFinanceira"></app-select>

            <div class="p-col-4 p-col-nopad">
                <div class="p-col-6" style="margin-top: 15px;">

                </div>
                <div class="p-col-6" style="margin-top: 15px;">

            <div style="display: flex;align-items: flex-end;justify-content: flex-end;" class="p-col-12">

                </div>

        <div *ngIf="segundaEtapa" class="p-col p-fluid">
            <div class="p-fluid p-formgrid p-grid">
                <div class="p-col-9 p-col-nopad">
                    <app-input [label]="'Classificação'" formControlName="Classificacao"></app-input>
                </div>
                <div class="p-col-3" style="margin-top: 18px;">
                    <!-- (clickOutside)="gerarClassificacao()" -->
                    <button pButton label="Calcular Classificação" (click)="gerarClassificacao()"></button>
                </div>
            </div>
            <div class="p-fluid p-formgrid p-grid">
                <div class="p-col-6">
                    <app-input [label]="'Cod. Plano de Contas'"></app-input>
                </div>
                <div class="p-col-4 p-offset-1" style="margin-top: 30px;">
                    <p-checkbox label="Exibir no App" [value]="true"></p-checkbox>
                </div>
            </div>            
            <div class="p-fluid p-formgrid p-grid">
                <div class="p-col-12">
                    <app-input [label]="'Historico'"></app-input>
                </div>
            </div>
            <div class="p-fluid p-formgrid p-grid">
                <div class="p-col-6">
                    <app-select [label]="'Tipo'"></app-select>
                </div>
            </div>
        </div>
        
        

        <div style="height: 350px;" *ngIf="terceiraEtapa && terceiraEtapaSintetico == false" class="p-col p-fluid">
            <div class="p-col-8 p-col-nopad">
                <div class="p-col-12">
                    <app-select label="Grupo de Natureza" [options]="selectNatureza"
                        formControlName="IdNaturezaFinGrupo"></app-select>
                </div>
                <div class="p-col-12 ">
                    <div class="p-col-8 p-col-nopad">
                        <app-input [label]="'Classificação'" formControlName="Classificacao"></app-input>
                    </div>
                    <div class="p-col-4" style="margin-top: 18px;">
                        <!-- (clickOutside)="gerarClassificacao()" -->
                        <button pButton label="Calcular Classificação" (click)="gerarClassificacao()"></button>
                    </div>
                </div>
                <div class="p-col-12">
                    <app-select [icon]="true" [label]="'Conta Contábil'" [options]="selectContaContabil"
                        formControlName="IdPlanoConta"></app-select>
                </div>
                <div class="p-col-12">
                    <app-input label="Histórico" formControlName="Historico"></app-input>
                </div>
                <div class="p-col-6" style="margin-top: -8px;margin-left: 5px;">
                    <label>Nível</label><br />
                    <p-spinner formControlName="Nível"></p-spinner>
                </div>
            </div>
            <div class="p-col-4" style="display: flex;align-items: flex-end;justify-content: flex-end;">
                <div class="p-col-6">
                    <button class="ui-button-danger" pButton type="button" label="Cancelar"
                        (click)="fecharModal()"></button>
                </div>
                <div class="p-col-6">
                    <button pButton label="Voltar" type="button" (click)="avancarOuVoltar(2)"></button>
                </div>
                <div class="p-col-6">
                    <button pButton label="Avançar" type="button" (click)="avancarOuVoltar(4)"></button>
                </div>
            </div>
        </div>

        <div *ngIf="quartaEtapa" class="p-col p-fluid">
            <div class="p-col-6 p-col-nopad">
                <div class="p-col-12">
                    <app-select [icon]="true" [label]="'Centro de Custos'" [options]="selectCentroCustos"
                        formControlName="IdCentroResultado"></app-select>
                </div>
                <div class="p-col-12">
                    <app-select-icon-container>
                        <app-select [icon]="true" [label]="'Projeto'" [options]="selectProjeto"
                            formControlName="IdProjeto"></app-select>
                        <div class="p-col-1 p-md-2 p-col-nopad ajustar-botao-select">
                            <button #projeto pButton type="button" icon="fa fa-plus"></button>
                        </div>


                        <!-- <app-modal *appModalOpenOnClick="[projeto, '1Acd5FXd2']" [hash]="'1Acd5FXd2'">
                                    <app-projeto-cadastro #content (dadosSalvos)="changeSelect($event)"></app-projeto-cadastro>
                                </app-modal>
                 -->
                    </app-select-icon-container>
                </div>
                <div class="p-col-12">
                    <app-input-integer label="Cod Controle" formControlName="CodControle" [maxLength]="8">
                    </app-input-integer>
                </div>
                <div class="p-col-12">
                    <app-select label="Tipo de Documento" [options]="selectTipoDocumentos"
                        formControlName="IdTipoDocumento"></app-select>
                </div>
                <div class="p-col-12">
                    <app-select label="Meio Pagamento" [options]="selectMeioPagamento"
                        formControlName="IdFinMeioPagamento"></app-select>
                </div>
            </div>
            <div class="p-col-6 p-col-nopad">
                <div class="p-col-12">
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Sintético</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="Sintetico"></p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Indica Permuta de Contas</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="IndicaPermuta"></p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Exibir Caixa/PDV</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="ApareceCaixa"></p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Exibir Contas a Pagar</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="ApareceAPagar"></p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Exibir Contas a Receber</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="ApareceAReceber"></p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Exibir nas Entradas</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="ApareceEntrada"></p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Exibir no Produto/Estoque</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel">
                            </p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Exibir na Tesouraria/Banco</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="ApareceTesouraria"></p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Livro Caixa</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="LivroCaixa"></p-toggleButton>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Gera proximo número:</span>
                        </div>
                        <div class="p-col-6">
                            <p-button [style]="{'width':'100px'}" (click)="gerarProximoNumero()" label="Gerar">
                            </p-button>
                        </div>
                    </div>
                    <div class="p-col-6">
                        <div class="p-col-6">
                            <span>Exibir APP:</span>
                        </div>
                        <div class="p-col-6">
                            <p-toggleButton [style]="{'width':'100px'}" [onLabel]="onLabel" [offLabel]="offLabel"
                                formControlName="ApareceApp"></p-toggleButton>
                        </div>
                    </div>
                </div>
                <div style="display: flex;align-items: flex-end;justify-self: flex-end;" class="ui-g-12">
                    <div class="p-col-4">
                        <button class="ui-button-danger" pButton type="button" label="Cancelar"
                            (click)="fecharModal()"></button>
                    </div>
                    <div class="p-col-4">
                        <button pButton label="Voltar" type="button" (click)="avancarOuVoltar(3)"></button>
                    </div>
                    <div class="p-col-4">
                        <button pButton label="Salvar" type="button" (click)="processarFormulario()"
                            style="background: #91c02d"></button>
                    </div>
                </div>
            </div>
        </div>        
    </p-card>
    <app-footer-page [end]="true" [tamanhoConfirma]="'p-col-3'" [tamanhoCancelar]="'p-col-3'"
                (confirmar)="processarFormulario()" (cancelar)="fecharModal()" [labelConfirmar]="'Confirmar'">
            </app-footer-page>
    <!-- </div> -->
    <!-- </app-page-divided> -->
</p-dialog>
<!-- </ng-template> -->
