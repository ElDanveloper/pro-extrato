<!doctype html>
<html lang="en">
<head>
  <meta lang="pt">  
  <meta charset="utf-8">
  <title>Pro Extrato</title>
  <base href="/">

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

  <link id="theme-css" rel="stylesheet" type="text/css" href="assets/theme/theme-dark-green.css">
  <link id="layout-css" rel="stylesheet" type="text/css" href="assets/layout/css/layout-dark-green.css">  
</head>
<body>
    <app-root>
        <div class="splash-screen">
            <div class="splash-loader-container">
                <svg class="splash-loader" width="65px" height="65px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
                   <circle class="splash-path" fill="none" stroke-width="6" stroke-linecap="round" cx="33" cy="33" r="30"></circle>
                </svg>
            </div>
        </div>
    </app-root>
    <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>
    <script>
      window.OneSignal = window.OneSignal || [];
      OneSignal.push(function() {
        OneSignal.init({
          appId: "8c39c189-54b0-4160-82c9-b9e7e4e2e0cb",
          safari_web_id: "web.onesignal.auto.257d0569-0e14-4d06-8d17-3d55d768ff68",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
</body>
</html>
